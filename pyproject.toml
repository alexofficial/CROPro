[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropro"
version = "0.1.8"
description = "Automated cropping of prostate MR images."
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Alexandors Patsanis" }
]
keywords = ["medical-imaging", "mri", "prostate", "cropping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "matplotlib>=3.10.9",
  "numpy>=2.4.6",
  "opencv-python>=4.13.0.92",
  "pyautoref>=2.2.1",
  "setuptools<84",
  "SimpleITK>=2.5.5",
]

[project.urls]
Homepage = "https://github.com/alexofficial/CROPro"
Repository = "https://github.com/alexofficial/CROPro"
Issues = "https://github.com/alexofficial/CROPro/issues"

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1",
  "cryptography>=48.0.1",
  "msgpack>=1.2.1",
  "pip-audit>=2.7",
  "pytest>=8",
  "ruff>=0.5",
  "twine>=5",
]

[project.scripts]
cropro = "cropro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Paths and options for the CROPro resample pipeline.
#
# ── When to use this INI file vs. config/pipeline.toml ───────────────────────
#
#   config/resample_paths.ini   (this file)
#       Paths-only shortcut for the *resample* pipeline only.
#       Controls folder paths and a handful of resample flags.
#       Use this for quick one-off resampling jobs where you only need to
#       point at different folders without touching crop or split settings.
#       Pass it with:  cropro resample --config config/resample_paths.ini
#
#   config/pipeline.toml
#       Full dataset definition — paths, naming suffixes, crop settings,
#       normalization, split ratios, and pipeline execution flags.
#       Works with every pipeline: resample, normalize, crop, and split.
#       Use this whenever you want a complete, reusable config for a dataset.
#       Pass it with:  cropro resample --schema config/pipeline.toml
#                      cropro crop     --schema config/pipeline.toml
#
# ─────────────────────────────────────────────────────────────────────────────
#
# Run with:
#     uv run cropro resample --config config/resample_paths.ini
#
# Any value passed on the command line overrides the matching key below.
# Leave a value empty to fall back to the default.

[paths]
# Directory with dataset cases (searched recursively for files matching t2w_suffix).
images_root = dataset/MyDataset/images

# Directory of *.zip image archives that are unpacked
# into images_root before resampling. Existing files are skipped, so this is
# safe to re-run. Set to "none" to disable. Leave empty to use the default
# (<images_root>/../archives).
archives_root = dataset/MyDataset/archives

# Where to write the resampled output. The images/<case>/ folder structure
# is mirrored, and each case folder gets the copied T2W, aligned ADC/HBV and the
# resampled gland/lesion masks.
output_root = dataset/MyDataset/images_resampled

# Whole-gland mask directory (files named <case_stem><mask_suffix>).
# Set to "none" to skip gland masks.
gland_root = dataset/MyDataset/masks/gland

# Lesion mask directory (files named <case_stem><mask_suffix>).
# Set to "none" to skip lesion masks.
lesion_root = dataset/MyDataset/masks/lesion

# Suffix used only when output_root is empty (files written next to originals).
suffix = _to_t2w

# Set to true to skip copying the reference T2W into the output folder.
no_t2w = false

# Set to true to overwrite existing output files instead of skipping them.
overwrite = false

# Paths and options for the CROPro resample pipeline.
#
# Run with:
#     uv run cropro resample --config config/resample_paths.ini
#
# Any value passed on the command line overrides the matching key below.
# Leave a value empty to fall back to the default.

[paths]
# Directory with PI-CAI cases (searched recursively for *_t2w.mha).
images_root = dataset/PI-CAI/images

# Directory of *.zip image archives (e.g. PI-CAI fold zips) that are unpacked
# into images_root before resampling. Existing files are skipped, so this is
# safe to re-run. Set to "none" to disable. Leave empty to use the default
# (<images_root>/../archives, i.e. dataset/PI-CAI/archives).
archives_root = dataset/PI-CAI/archives

# Where to write the resampled output. The images/<patient>/ folder structure
# is mirrored, and each case folder gets the copied T2W, aligned ADC/HBV and the
# resampled gland/lesion masks.
output_root = dataset/PI-CAI/images_resampled

# Whole-gland mask directory (files named <patient>_<study>.nii.gz).
# Set to "none" to skip gland masks. Leave empty to use the PI-CAI default
# (picai_labels/anatomical_delineations/whole_gland/AI/Bosma22b).
gland_root = dataset/PI-CAI/picai_labels/anatomical_delineations/whole_gland/AI/Bosma22b

# Lesion mask directory (files named <patient>_<study>.nii.gz).
# Set to "none" to skip lesion masks. Leave empty to use the PI-CAI default
# (picai_labels/csPCa_lesion_delineations/AI/Bosma22a).
lesion_root = dataset/PI-CAI/picai_labels/csPCa_lesion_delineations/AI/Bosma22a

# Suffix used only when output_root is empty (files written next to originals).
suffix = _to_t2w

# Set to true to skip copying the reference T2W into the output folder.
no_t2w = false

# Set to true to overwrite existing output files instead of skipping them.
overwrite = false

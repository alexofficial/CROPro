# CROPro dataset schema for Prostate158
# https://zenodo.org/records/6481141
#
# Usage:
#   cropro download --dataset prostate158
#   cropro resample --schema config/dataset_prostate158.toml
#   cropro crop     --schema config/dataset_prostate158.toml --crop_method stride ...
#
# CLI flags take precedence over values here, so you can override individual
# settings without editing this file.

[dataset]
name = "Prostate158"

[paths]
# Where the extracted Prostate158 images live.
# The downloaded zip extracts to:
#   dataset/Prostate158/images/prostate158_train/train/<patient_id>/
images_root   = "dataset/Prostate158/images"
archives_root = "none"

# Where the resampled (T2W-aligned) copies are written.
output_root   = "dataset/Prostate158/images_resampled"

# Base folder for all CROPro crop outputs.
# Each crop run is stored under: cropro_root/<Name>_<method>_<spacing>_<size>/
cropro_root   = "dataset/Prostate158/cropped_images"

# Prostate158 stores gland masks alongside the images (_anatomy_reader1.nii.gz).
# CROPro cannot auto-detect per-file co-located masks yet; set to "none" unless
# you extract the anatomy masks into a flat folder first.
gland_root    = "none"

# Lesion masks (tumour annotations stored next to each case).
# Set to a flat folder path if you have extracted them, or "none" to skip.
lesion_root   = "none"

[naming]
# Prostate158 uses bare filenames inside per-patient sub-folders.
# Each case folder contains: t2.nii.gz, adc.nii.gz, dwi.nii.gz
t2w_suffix  = "t2.nii.gz"
adc_suffix  = "adc.nii.gz"
hbv_suffix  = "dwi.nii.gz"    # Prostate158 DWI is used as HBV equivalent
mask_suffix = ".nii.gz"

[crop]
sequence_type    = "bpMRI"
pixel_spacing    = 0.4
crop_image_size  = 128
crop_stride      = 32
crop_method      = "random"
sample_number    = 12
c_min_positive   = 0.2
saved_image_type = "png"
do_normalization = true
t2w_normalization_method = "gaussian"
keep_all_slice   = true
skip_existing_slices = true
number_of_slices_to_exclude_from_mask_gland = 1

[split]
# Set enabled = true to split cases into train / val / test before cropping.
# Val and test always use stride + unknown patient status (patient-level inference).
enabled      = true
train_ratio  = 0.70
val_ratio    = 0.15
test_ratio   = 0.15
seed         = 42
stratify     = true
split_level  = "patient"

# No human annotation folder for Prostate158; leave empty to allow all cases in test.
human_labels_root = ""

[pipeline]
# One command should be enough: resample the dataset first, then split and crop.
resample_dataset = true

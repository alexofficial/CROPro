# CROPro dataset schema for PI-CAI
# https://zenodo.org/records/6624726  /  https://github.com/DIAGNijmegen/picai_labels
#
# Usage:
#   cropro download --dataset picai --folds 0
#   cropro resample --schema config/dataset_picai.toml
#   cropro crop     --schema config/dataset_picai.toml --crop_method stride ...
#
# CLI flags take precedence over values here, so you can override individual
# settings without editing this file.

[dataset]
name = "PI-CAI"

[paths]
# Where raw PI-CAI image zips and cases live.
images_root   = "dataset/PI-CAI/images"
archives_root = "dataset/PI-CAI/archives"

# Where the resampled (T2W-aligned) copies are written.
output_root   = "dataset/PI-CAI/images_resampled"

# Base folder for all CROPro crop outputs.
# Each crop run is stored under: cropro_root/<Name>_<method>_<spacing>_<size>/
# e.g. dataset/PI-CAI/cropped_images/PICAI_random_0.4_128/
cropro_root   = "dataset/PI-CAI/cropped_images"

# Whole-gland masks (Bosma22b anatomical delineations).
gland_root    = "dataset/PI-CAI/picai_labels/anatomical_delineations/whole_gland/AI/Bosma22b"

# Lesion masks (Bosma22a AI annotations).
# Human expert delineations are under:
#   dataset/PI-CAI/picai_labels/csPCa_lesion_delineations/Human_expert/
lesion_root_ai_generated_labels       = "dataset/PI-CAI/picai_labels/csPCa_lesion_delineations/AI/Bosma22a"
lesion_root_human_generated_labels    = "dataset/PI-CAI/picai_labels/csPCa_lesion_delineations/human_expert/resampled"

[naming]
# PI-CAI uses "<patient>_<study>" stems with these suffixes.
t2w_suffix  = "_t2w.mha"
adc_suffix  = "_adc.mha"
hbv_suffix  = "_hbv.mha"
mask_suffix = ".nii.gz"

[crop]
sequence_type    = "bpMRI"
pixel_spacing    = 0.4
crop_image_size  = 128
crop_stride      = 32
crop_method      = "random"
sample_number    = 12
c_min_positive   = 0.2
saved_image_type = "png"
do_normalization = true
t2w_normalization_method = "autoref"
keep_all_slice   = true
skip_existing_slices = true
number_of_slices_to_exclude_from_mask_gland = 1

[split]
# Set enabled = true to crop first, then split outputs into train / val / test.
# Val and test always use stride + unknown patient status (patient-level inference).
# By default, split folders are written under:
#   <cropro_root>/ai_ready_dataset/{train,val,test}
# Use --split-output-root to override.
enabled      = true
train_ratio  = 0.70
val_ratio    = 0.15
test_ratio   = 0.15
seed         = 42
stratify     = true    # preserve positive fraction in each subset
split_level  = "patient"  # "patient" (all gland slices) | "lesion"

# Optional: restrict the test set to cases with human expert annotations.
# Positive cases WITHOUT a file here are restricted to train/val only.
# Leave empty ("") to allow all cases in the test set.
human_labels_root = "dataset/PI-CAI/picai_labels/csPCa_lesion_delineations/Human_expert"

[pipeline]
# First step: normalize all 3D T2W volumes with AutoRef and write them to
# dataset/PI-CAI/normalized (derived from images_root), then use them as the
# reference for dataset-level resampling.
normalize_t2w_3D = true

# One command should be enough: resample the dataset first, then crop and split outputs.
resample_dataset = true

# Keep false here so the pre-step really runs from [paths].images_root.
# Set true only when you intentionally want to skip pre-resample work.
already_resampled = false

[metadata]
# CSV file with per-case clinical information used to classify positive / negative.
# Positive = clinically significant prostate cancer (csPCa, ISUP >= 2).
# Negative = ISUP <= 1 or no cancer.
csv_path        = "dataset/PI-CAI/picai_labels/clinical_information/marksheet.csv"
# Columns whose values are combined to build the case stem (patient_id + "_" + study_id).
case_id_columns = ["patient_id", "study_id"]
case_id_format  = "{patient_id}_{study_id}"
# Column and values that flag a case as positive.
positive_column = "case_csPCa"
positive_values = ["YES"]
# Subset of CSV columns included in the split manifest per case.
manifest_columns = ["case_csPCa", "case_ISUP", "lesion_ISUP"]
